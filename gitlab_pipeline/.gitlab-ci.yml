include:
  - project: 'apptainer/admin/templates'
    file: '.gitlab-ci-template.yml'

variables:
  CVMFS_PROJECT_VERSION: "1.0"

build-apptainer-image:
  extends: .build-apptainer-image
  variables:
    # The template writes each listed name into the --build-arg-file, which is
    # how scan_planner.def receives the ephemeral job token used to clone the
    # source. Keeps any long-lived credential out of the definition file.
    APPTAINER_TEMPLATE_VARIABLES: "CI_JOB_TOKEN"

deploy-apptainer-images:
  extends: .deploy-apptainer-images
  variables:
    EXPOSED_COMMANDS: |
      scan_planner:scan_planner
