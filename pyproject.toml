[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scan_plan"
version = "2026.5.0"
description = "Advanced GUI for Cylinder Packing Strategy in high-resolution tomography."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tifffile",
    "pyvista",
    "pyvistaqt",
    "pandas",
    "scipy>=1.15",
    "PyQt5",
    "pint"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["scan_plan"]

[tool.setuptools.package-data]
scan_plan = ["instrument_defaults.json", "presets/*.json"]

[project.scripts]
scan_planner = "scan_plan.cli:main"
# Backward-compat alias for older runscripts / muscle memory.
scan-plan = "scan_plan.cli:main"